<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>TrisDashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="dashboard">
  <header class="header">
    <div class="header-time">
      <p class="eyebrow">TRIS DASHBOARD</p>
      <h1 id="clock">--:--</h1>
      <p class="muted" id="date">Loading date</p>
    </div>
    <div class="server-status" role="status" aria-live="polite">
      <span id="indicator" class="indicator"></span>
      <span id="connection">Connecting</span>
    </div>
  </header>
  <section class="cards" aria-label="Dashboard modules">
    <article class="card"><h2>Portfolio</h2><p>Coming soon</p><small>Investments &amp; dividends</small></article>
    <article class="card"><h2>Development</h2><p>Coming soon</p><small>GitHub &amp; CI</small></article>
    <article class="card"><h2>Weather</h2><p>Coming soon</p><small>Local forecast</small></article>
    <article class="card"><h2>Fitness</h2><p>Coming soon</p><small>Workout summary</small></article>
  </section>
  <footer>Local network &middot; TrisDashboard</footer>
</main>
<script src="/static/dashboard.js"></script>
</body>
</html>
